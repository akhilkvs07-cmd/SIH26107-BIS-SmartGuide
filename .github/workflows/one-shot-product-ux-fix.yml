name: One-shot product and UX migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Apply product and UX migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply product and UX fixes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('backend/bis_data.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          standards = data.get('standards', [])
          target = None
          for item in standards:
              if str(item.get('standard_number', '')).replace(' ', '').startswith('IS/IEC62368-1'):
                  target = item
                  break
          if target is not None:
              aliases = target.setdefault('synonyms', [])
              additions = [
                  'mobile phone', 'mobile phones', 'smartphone', 'smartphones',
                  'cell phone', 'cell phones', 'cellular phone', 'mobile handset',
                  'telecom handset', 'wireless handset'
              ]
              for alias in additions:
                  if alias not in aliases:
                      aliases.append(alias)
              target['description'] = target.get('description', '')
              note = ' Product terminology also includes mobile phones and related cellular handsets for discovery; exact applicability remains subject to the current BIS/CRS scope.'
              if 'mobile phones and related cellular handsets for discovery' not in target['description']:
                  target['description'] += note
              data['count'] = len(standards)
              data_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          click_path = Path('smartguide-v8-click-fix.js')
          click_text = click_path.read_text(encoding='utf-8')
          click_text = click_text.replace("open.textContent='Open workflow →';", "open.textContent='Get started →';")
          click_path.write_text(click_text, encoding='utf-8')

          test_path = Path('tests/test_upgrade_regressions.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace('from app_upgrade import app', 'from app import app')
          test_path.write_text(test_text, encoding='utf-8')
          PY

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/bis_data.json smartguide-v8-click-fix.js tests/test_upgrade_regressions.py
          git diff --cached --quiet && echo "No migration changes needed" || git commit -m "Apply product and UX migration"
          git push

      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-product-ux-fix.yml
          git commit -m "Remove one-shot migration workflow"
          git push
