name: Integrate SmartGuide UI upgrades
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Attach SmartGuide UI layers
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); text=p.read_text(encoding='utf-8')
          text=text.replace('<script src="smartguide-v6.js"></script>','')
          text=text.replace('<link rel="stylesheet" href="smartguide-v6.css">','')
          for layer in ['<link rel="stylesheet" href="smartguide-v7.css">','<link rel="manifest" href="manifest.webmanifest">']:
            if layer not in text:text=text.replace('</head>',layer+'\n</head>',1)
          for layer in ['<script src="smartguide-v7.js"></script>','<script src="smartguide-v7-fix.js"></script>']:
            if layer not in text:text=text.replace('</body>',layer+'\n</body>',1)
          p.write_text(text,encoding='utf-8')
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "No integration changes needed"; else git add index.html; git commit -m "Integrate V7 feature console fixes"; git push; fi
