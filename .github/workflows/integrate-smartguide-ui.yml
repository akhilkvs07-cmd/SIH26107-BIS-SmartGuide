name: Integrate SmartGuide UI upgrades

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attach premium UI layers to existing UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          changed = False
          css = '<link rel="stylesheet" href="smartguide-pro.css">'
          ref_css = '<link rel="stylesheet" href="reference-ui.css">'
          js = '<script src="smartguide-enhance.js"></script>'
          marker = '</head>'
          if css not in text:
              if marker not in text:
                  raise SystemExit('index.html has no closing head tag')
              text = text.replace(marker, css + '\n' + marker, 1)
              changed = True
              print('Integrated smartguide-pro.css')
          if ref_css not in text:
              if marker not in text:
                  raise SystemExit('index.html has no closing head tag')
              text = text.replace(marker, ref_css + '\n' + marker, 1)
              changed = True
              print('Integrated reference-ui.css')
          if js not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('index.html has no closing body tag')
              text = text.replace(marker, js + '\n' + marker, 1)
              changed = True
              print('Integrated smartguide-enhance.js')
          if changed:
              p.write_text(text, encoding='utf-8')
          else:
              print('UI integration already present')

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No integration changes needed"
          else
            git add index.html
            git commit -m "Integrate reference-inspired SmartGuide UI"
            git push
          fi
