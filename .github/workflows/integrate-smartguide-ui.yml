name: Integrate SmartGuide UI upgrades

# v12 integration: browser failsafe, agent UI, trust dashboard and verified lab router.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore original SmartGuide Overview
        shell: bash
        run: |
          git show 080b7f8d1efcab8c3fc7a24c23ad5230f6b241fd:index.html > index.html

      - name: Commit restored Overview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "Overview already restored"; else git commit -m "Restore original SmartGuide Overview UI" && git push; fi
