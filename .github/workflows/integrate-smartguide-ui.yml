name: Integrate SmartGuide UI upgrades

# Manual-only maintenance workflow.
# The previous push trigger caused this workflow to edit index.html and push again,
# which retriggered itself and created a deployment loop.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install clean Advanced Features UI
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')

          patterns=[
            r'<link\s+rel=["\']stylesheet["\']\s+href=["\']smartguide-v7[^"\']*["\']\s*>',
            r'<script\s+src=["\']smartguide-v7[^"\']*["\']\s*></script>',
            r'<script\s+src=["\']smartguide-universal\.js[^"\']*["\']\s*></script>',
            r'<script\s+src=["\']smartguide-navigation-fix\.js[^"\']*["\']\s*></script>',
            r'<script\s+src=["\']smartguide-v6(?:-click-fix)?\.js(?:\?[^"\']*)?["\']\s*></script>',
            r'<link\s+rel=["\']stylesheet["\']\s+href=["\']smartguide-v6\.css(?:\?[^"\']*)?["\']\s*>',
            r'<script\s+src=["\']command-center-fix\.js(?:\?[^"\']*)?["\']\s*></script>'
          ]
          for pattern in patterns:
            text=re.sub(pattern,'',text,flags=re.I)

          text=re.sub(r'<script data-sg-cache-cleanup="1">.*?</script>\s*','',text,flags=re.I|re.S)
          cleanup='''<script data-sg-cache-cleanup="1">
          (() => {
            try {
              if(location.hash==='#sw-disabled') history.replaceState(null,document.title,location.pathname+location.search);
              if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});
              if('caches' in window) caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).catch(()=>{});
            } catch(_){}
          })();
          </script>'''

          nav_button='''<button id="v8Nav" type="button" onclick="if(window.page){window.page('v8',this,'Advanced Features')}" aria-label="Open Advanced Features"><span>✦</span><span>Advanced Features</span></button>'''
          text=re.sub(r'<button[^>]*id=["\']v8Nav["\'][\s\S]*?</button>\s*','',text,flags=re.I)
          nav_match=re.search(r'<nav class="nav">([\s\S]*?)</nav>',text,flags=re.I)
          if nav_match:
            nav_inner=nav_match.group(1).rstrip()
            text=text[:nav_match.start(1)]+nav_inner+'\n    '+nav_button+'\n  '+text[nav_match.end(1):]

          text=text.replace('<button onclick="page(\'assistant\',this,\'AI Assistant\')">✦ <span>AI Assistant</span></button>', '<button onclick="page(\'assistant\',this,\'AI Assistant\')">◎ <span>AI Assistant</span></button>')
          text=text.replace('<button onclick="page(\'assistant\',this,\'AI Assistant\')">✦&nbsp;<span>AI Assistant</span></button>', '<button onclick="page(\'assistant\',this,\'AI Assistant\')">◎ <span>AI Assistant</span></button>')
          text=text.replace('Advanced Intelligence','Advanced Features')

          css='<link rel="stylesheet" href="smartguide-v8.css?v=20260910-v8-9">'
          js='<script src="smartguide-v8.js?v=20260910-v8-9"></script>'
          fix='<script src="command-center-fix.js?v=20260910-v8-9"></script>'
          ux='<script src="smartguide-ux-v9.js?v=20260910-v9-1"></script>'
          text=re.sub(r'<link\s+rel=["\']stylesheet["\']\s+href=["\']smartguide-v8\.css(?:\?[^"\']*)?["\']\s*>','',text,flags=re.I)
          text=re.sub(r'<script\s+src=["\']smartguide-v8\.js(?:\?[^"\']*)?["\']\s*></script>','',text,flags=re.I)
          text=re.sub(r'<script\s+src=["\']smartguide-ux-v9\.js(?:\?[^"\']*)?["\']\s*></script>','',text,flags=re.I)
          text=text.replace('</head>',cleanup+'\n'+css+'\n</head>',1)
          text=text.replace('</body>',js+'\n'+fix+'\n'+ux+'\n</body>',1)
          if '<link rel="manifest"' not in text:
            text=text.replace('</head>','<link rel="manifest" href="manifest.webmanifest">\n</head>',1)
          p.write_text(text,encoding='utf-8')

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "No integration changes needed"; else git add index.html && git commit -m "Apply SmartGuide UI integration" && git push; fi
