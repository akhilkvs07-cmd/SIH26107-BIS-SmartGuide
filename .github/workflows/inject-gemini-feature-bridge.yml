name: Validate Gemini feature bridge

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'gemini-feature-bridge.js'
      - '.github/workflows/inject-gemini-feature-bridge.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'gemini-feature-bridge.js'
      - '.github/workflows/inject-gemini-feature-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check bridge JavaScript syntax
        run: node --check gemini-feature-bridge.js

      - name: Verify bridge is loaded exactly once
        shell: python
        run: |
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          refs = html.count('src="gemini-feature-bridge.js') + html.count("src='gemini-feature-bridge.js")
          assert refs == 1, f"Expected exactly one Gemini bridge script tag; found {refs}"
          assert html.lower().index("smartguide-failsafe.js") < html.lower().index("gemini-feature-bridge.js"), (
              "Load the bridge after the fetch failsafe so its wrapper composes with the failsafe."
          )
          print("Gemini bridge is present exactly once and loads after the fetch failsafe.")
