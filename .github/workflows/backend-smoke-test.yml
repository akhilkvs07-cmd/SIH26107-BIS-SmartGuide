name: BIS SmartGuide backend smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run endpoint smoke tests
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import io, struct
          from app_upgrade import app

          c = app.test_client()
          assert c.get('/health').status_code == 200
          assert c.get('/v5/feature-status').status_code == 200
          assert c.get('/v5/self-test').get_json()['ok'] is True
          assert c.post('/v5/product-intelligence', json={'description':'1200W electric kettle'}).status_code == 200
          assert c.post('/v5/verify-mark', json={'text':'ISI IS 302 CM/L-1234567'}).status_code == 200
          assert c.post('/v5/test-report', json={'standard':'IS 302','text':'Voltage: 230 V Power: 1200 W'}).status_code == 200
          assert c.post('/v5/label-check', json={'text':'Electric Kettle Manufacturer ABC Model EK-1200 IS 302 1200 W 230 V ISI'}).status_code == 200
          assert c.get('/v5/lab-match?standard=IS%20302').status_code == 200
          assert c.post('/v5/amendment-impact', json={'standard':'IS 302','amendment':'testing and marking requirements'}).status_code == 200
          assert c.post('/v5/procurement', json={'product':'electric kettle','hs_code':'851679','raw_material':'stainless steel'}).status_code == 200
          assert c.post('/v5/issue-report', json={'product':'electric kettle','issue':'suspected counterfeit ISI mark'}).status_code == 200

          # V8.5 source-grounded layer.
          assert c.get('/api/v8/health').status_code == 200
          pi = c.post('/api/v8/product-intelligence', json={'query':'2 burner domestic LPG gas stove'})
          assert pi.status_code == 200 and 'evidence_classification' in pi.get_json()['data']

          # Product discovery regression: common mobile-phone wording must reach the ICT safety corpus.
          mobile = c.post('/api/v8/product-intelligence', json={'query':'mobile phone'})
          assert mobile.status_code == 200
          mobile_data = mobile.get_json()
          mobile_payload = mobile_data.get('data') or {}
          mobile_candidates = mobile_payload.get('candidate_standards', [])
          assert mobile_payload.get('classification') != 'NON_PRODUCT'
          assert any('62368' in str(x.get('standard_number', '')) for x in mobile_candidates), mobile_data

          for alias in ['smartphone', 'cell phone', 'mobile handset']:
              alias_result = c.post('/api/v8/product-intelligence', json={'query':alias})
              assert alias_result.status_code == 200
              alias_payload = alias_result.get_json().get('data') or {}
              assert alias_payload.get('candidate_standards') is not None

          labs = c.get('/api/v8/labs/search?standard=IS%2FIEC%2062368-1')
          assert labs.status_code == 200
          lab_data = labs.get_json().get('data') or {}
          assert lab_data.get('laboratories') is not None
          resources = lab_data.get('official_resources') or {}
          assert resources.get('bis_lims_search') or lab_data.get('official_lims_search')

          mark = c.post('/api/v8/verify/mark', json={'text':'ISI CM/L 1234567 IS 4246'})
          assert mark.status_code == 200 and mark.get_json()['status'] == 'SOURCE_UNAVAILABLE'
          doc = c.post('/api/v8/document/ingest', data={'file':(io.BytesIO(b'IS 4246\n1.1 Scope\n1.2 Requirements'), 'sample.txt')}, content_type='multipart/form-data')
          assert doc.status_code == 200 and doc.get_json()['data']['metadata']['document_hash']
          am = c.post('/api/v8/amendments/impact', json={'standard':'IS 4246','amendment':'1.2 revised requirement shall apply'})
          assert am.status_code == 200 and am.get_json()['status'] == 'INFERRED'
          agent = c.post('/api/v8/agent/orchestrate', json={'role':'manufacturer_msme','message':'I manufacture gas stoves. Find a lab and check the standard.'})
          assert agent.status_code == 200 and 'labs/match' in agent.get_json()['data']['route']

          # Minimal valid binary STL: one triangle.
          header=b'SIH SmartGuide STL'.ljust(80,b' ')
          tri=struct.pack('<12fH',0,0,1, 0,0,0, 1,0,0, 0,1,0, 0)
          stl=header+struct.pack('<I',1)+tri
          r=c.post('/v5/stl-scan', data={'file':(io.BytesIO(stl),'triangle.stl')}, content_type='multipart/form-data')
          assert r.status_code == 200, r.get_json()
          assert r.get_json()['triangle_count'] == 1
          print('BIS SmartGuide backend smoke tests passed')
          PY